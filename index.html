<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karamabus Beni Mellal - Officiel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --primary: #131108; --secondary: #df6a05; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        
        .header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .nav-box { background: white; padding: 15px; border-radius: 15px; margin-top: -30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .btn-green { background: var(--success); }
        .btn-orange { background: var(--secondary); }
        .btn-dark { background: var(--primary); }

        /* Modaux */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; width: 90%; max-width: 400px; border-radius: 15px; max-height: 90vh; overflow-y: auto; }

        /* Carte Digitale */
        #result-card { display: none; background: white; padding: 20px; border-radius: 15px; border-left: 8px solid var(--secondary); margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        #qrcode { margin-top: 15px; display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚌 Karamabus</h1>
    <p>Réseau de transport de Beni Mellal</p>
</div>

<div class="container">
    <div class="nav-box">
        <input type="text" id="search-input" placeholder="🔍 Rechercher une ligne ou un arrêt..." onkeyup="filtrerBus()">
        <div style="display: flex; gap: 10px;">
            <button class="btn-green" onclick="ouvrirAbonnement()">🎓 Abonnement</button>
            <button class="btn-orange" onclick="toggleModal('modal-ticket')">🎟️ Ticket</button>
        </div>
    </div>

    <div id="result-card">
        <div class="card-header">
            <div>
                <h3 id="res-nom">NOM PRENOM</h3>
                <p id="res-cin" style="color: #666;"></p>
            </div>
            <div style="color: var(--success); font-weight: bold;">✓ ACTIF</div>
        </div>
        <div id="qrcode"></div>
        <button class="btn-dark" onclick="telechargerRecu()">📥 Télécharger Reçu PDF</button>
    </div>

    <div id="liste-bus" style="margin-top:20px;">
        </div>
</div>

<div id="modal-abo" class="modal">
    <div class="modal-content">
        <h2 id="titre-abo">Abonnement Etudiant</h2>
        
        <div id="selection-type">
            <button class="btn-dark" onclick="demarrerParcours('nouveau')">Créer ma 1ère Carte</button>
            <button class="btn-orange" onclick="demarrerParcours('payer')">Déjà abonné (Payer)</button>
        </div>

        <div id="step-1" style="display:none;">
            <input type="text" id="field-nom" placeholder="Nom">
            <input type="text" id="field-prenom" placeholder="Prénom">
            <input type="text" id="field-cin" placeholder="CIN (ex: AB123456)">
            <div id="zone-docs">
                <label style="font-size: 12px;">Attestation de scolarité :</label>
                <input type="file" id="file-scol">
                <label style="font-size: 12px;">Photo d'identité :</label>
                <input type="file" id="file-photo">
            </div>
            <button class="btn-green" onclick="validerIdentite()">Suivant</button>
        </div>

        <div id="step-2" style="display:none;">
            <h4>💳 Paiement Sécurisé</h4>
            <input type="text" id="card-num" placeholder="N° de carte (16 chiffres)" maxlength="16">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="card-exp" placeholder="MM/AA" maxlength="5">
                <input type="text" id="card-cvv" placeholder="CVV" maxlength="3">
            </div>
            <button class="btn-green" onclick="finaliserAbonnement()">Payer et Activer</button>
        </div>

        <button onclick="toggleModal('modal-abo')" style="background:#eee; color:#333; margin-top:10px;">Fermer</button>
    </div>
</div>

<div id="modal-ticket" class="modal">
    <div class="modal-content">
        <h2>Achat Ticket Express</h2>
        <label>Destination :</label>
        <select id="ticket-dest">
            <option value="3">Centre Ville (3 DH)</option>
            <option value="4">Faculté Mghila (4 DH)</option>
            <option value="5">Foum El Anceur (5 DH)</option>
        </select>
        <input type="text" id="t-card" placeholder="N° de carte bancaire">
        <button class="btn-orange" onclick="validerTicket()">Acheter le Ticket</button>
        <button onclick="toggleModal('modal-ticket')" style="background:#eee; color:#333;">Annuler</button>
    </div>
</div>

<script>
    let busData = [];
    let mode = ''; // 'nouveau' ou 'payer'

    // Initialisation
    async function init() {
        try {
            const res = await fetch('/api/trajets');
            busData = await res.json();
            renderBus(busData);
        } catch (e) { console.log("Erreur chargement bus"); }
    }

    function renderBus(data) {
        const container = document.getElementById('liste-bus');
        container.innerHTML = data.map(b => `
            <div style="background:white; padding:15px; border-radius:10px; margin-bottom:10px; border-left:5px solid var(--secondary); display:flex; justify-content:space-between;">
                <strong>${b.ligne}</strong>
                <span>${b.itineraire}</span>
            </div>
        `).join('');
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function ouvrirAbonnement() {
        document.getElementById('selection-type').style.display = 'block';
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'none';
        toggleModal('modal-abo');
    }

    function demarrerParcours(m) {
        mode = m;
        document.getElementById('selection-type').style.display = 'none';
        document.getElementById('step-1').style.display = 'block';
        // Si déjà abonné, on cache les imports de documents
        document.getElementById('zone-docs').style.display = (mode === 'payer') ? 'none' : 'block';
    }

    function validerIdentite() {
        const nom = document.getElementById('field-nom').value;
        const prenom = document.getElementById('field-prenom').value;
        const cin = document.getElementById('field-cin').value;
        const cinRegex = /^[A-Z]{1,2}[0-9]{4,6}$/i;

        if(!nom || !prenom || !cin) return alert("Veuillez remplir tous les champs.");
        if(!cinRegex.test(cin)) return alert("Format de CIN invalide (ex: AB123456)");
        
        if(mode === 'nouveau') {
            const scol = document.getElementById('file-scol').files[0];
            const photo = document.getElementById('file-photo').files[0];
            if(!scol || !photo) return alert("Veuillez importer l'attestation et la photo.");
        }

        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    function finaliserAbonnement() {
        const cNum = document.getElementById('card-num').value;
        if(cNum.length < 16) return alert("Carte bancaire invalide.");

        const nom = document.getElementById('field-nom').value.toUpperCase();
        const prenom = document.getElementById('field-prenom').value.toUpperCase();
        const cin = document.getElementById('field-cin').value.toUpperCase();

        alert("Paiement réussi !");
        
        // Affichage de la carte
        document.getElementById('res-nom').innerText = nom + " " + prenom;
        document.getElementById('res-cin').innerText = "CIN: " + cin;
        
        const qrc = document.getElementById('qrcode');
        qrc.innerHTML = "";
        new QRCode(qrc, { text: KARAMABUS-ABO-${cin}, width: 128, height: 128 });
        
        document.getElementById('result-card').style.display = 'block';
        toggleModal('modal-abo');
        telechargerRecu("ABONNEMENT", nom, cin);
    }

    function validerTicket() {
        const cNum = document.getElementById('t-card').value;
        if(cNum.length < 16) return alert("Carte bancaire invalide.");
        
        const dest = document.getElementById('ticket-dest');
        const label = dest.options[dest.selectedIndex].text;
        
        alert("Ticket acheté ! Téléchargement du reçu...");
        telechargerRecu("TICKET UNITAIRE", "CLIENT PASSAGER", label);
        toggleModal('modal-ticket');
    }

    function telechargerRecu(type, nom, info) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const date = new Date().toLocaleString();

        doc.setFontSize(20);
        doc.text("RECU KARAMA BUS", 20, 20);
        doc.setFontSize(12);
        doc.text(Type: ${type}, 20, 40);
        doc.text(Date: ${date}, 20, 50);
        doc.text(Titulaire: ${nom}, 20, 60);
        doc.text(Détails: ${info}, 20, 70);
        doc.text("Merci d'utiliser nos lignes de transport.", 20, 90);
        
        doc.save(Recu_Karamabus_${nom}.pdf);
    }

    init();
</script>
</body>
</html>
